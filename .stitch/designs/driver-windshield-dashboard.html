<script>
        // Simple crossfade logic
        const images = document.querySelectorAll('#windshield-crossfade img');
        let currentIndex = 0;

        function crossfade() {
            images[currentIndex].classList.remove('active');
            images[currentIndex].classList.add('inactive');
            
            currentIndex = (currentIndex + 1) % images.length;
            
            images[currentIndex].classList.remove('inactive');
            images[currentIndex].classList.add('active');
        }

        // Run crossfade every 5 seconds
        setInterval(crossfade, 5000);
    </script>
