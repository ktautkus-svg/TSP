name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel an in-flight production deploy. A newer push to main waits
# until this group is free instead of aborting Cloud Build / Cloud Run.
concurrency:
  group: cloud-run-production
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER || '39855768031' }}
  GCP_REGION: ${{ vars.GCP_REGION || 'europe-north1' }}
  CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'logistikos-pristatymai' }}
  GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}

jobs:
  quality:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Validate SQLite schema
        run: npm run validate:schema

      - name: Build PWA
        run: npm run pwa:build

      - name: Validate PWA bundle contract
        run: npm run pwa:test

  deploy:
    name: Deploy production revision
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Bind existing Secret Manager values
        id: secrets
        shell: bash
        run: |
          set -euo pipefail
          SECRET_NAMES=(
            GATEWAY_DEVICE_SECRET
            GOOGLE_API_KEY
            GOOGLE_ROUTES_API_KEY
            GOOGLE_GEOCODING_API_KEY
            GOOGLE_MAPS_API_KEY
            GOOGLE_VISION_API_KEY
            HERE_API_KEY
            TSP_INITIAL_ADMIN_PIN
          )
          PAIRS=()
          for name in "${SECRET_NAMES[@]}"; do
            if gcloud secrets describe "$name" --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
              PAIRS+=("${name}=${name}:latest")
            fi
          done
          if ! gcloud secrets describe GATEWAY_DEVICE_SECRET --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
            echo 'GATEWAY_DEVICE_SECRET missing in Secret Manager.' >&2
            exit 1
          fi
          if ! gcloud secrets describe TSP_INITIAL_ADMIN_PIN --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
            echo 'TSP_INITIAL_ADMIN_PIN missing in Secret Manager.' >&2
            exit 1
          fi
          PROVIDER_FOUND=false
          for name in GOOGLE_API_KEY GOOGLE_ROUTES_API_KEY GOOGLE_GEOCODING_API_KEY GOOGLE_MAPS_API_KEY GOOGLE_VISION_API_KEY HERE_API_KEY; do
            if gcloud secrets describe "$name" --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
              PROVIDER_FOUND=true
              break
            fi
          done
          if [ "$PROVIDER_FOUND" = false ]; then
            echo 'At least one provider API key is required in Secret Manager.' >&2
            exit 1
          fi
          SECRETS_ARG=$(IFS=,; echo "${PAIRS[*]}")
          echo "secrets_arg=$SECRETS_ARG" >> "$GITHUB_OUTPUT"

      - name: Grant Cloud Run access to secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GCP_PROJECT_NUMBER" ]; then
            echo 'GCP_PROJECT_NUMBER GitHub Variable is required.' >&2
            exit 1
          fi
          runtime_service_account="${GCP_PROJECT_NUMBER}-compute@developer.gserviceaccount.com"
          for name in GATEWAY_DEVICE_SECRET TSP_INITIAL_ADMIN_PIN GOOGLE_API_KEY GOOGLE_ROUTES_API_KEY GOOGLE_GEOCODING_API_KEY GOOGLE_MAPS_API_KEY GOOGLE_VISION_API_KEY HERE_API_KEY; do
            if gcloud secrets describe "$name" --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
              gcloud secrets add-iam-policy-binding "$name" \
                --project="$GCP_PROJECT_ID" \
                --member="serviceAccount:${runtime_service_account}" \
                --role='roles/secretmanager.secretAccessor' \
                --quiet
            fi
          done

      - name: Build and push image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/cloud-run-source-deploy/${CLOUD_RUN_SERVICE}:sha-${GITHUB_SHA}"
          # The CI service account cannot read the VPC-SC-protected default logs
          # bucket. Suppress log streaming; the polling loop below reads only
          # build metadata and remains the source of truth for completion.
          build_id=$(gcloud builds submit \
            --project="$GCP_PROJECT_ID" \
            --tag="$image" \
            --timeout=1200s \
            --async \
            --suppress-logs \
            --format='value(id)')
          echo "Cloud Build ${build_id} started for ${image}"
          status=""
          for _ in $(seq 1 120); do
            status=$(gcloud builds describe "$build_id" --project="$GCP_PROJECT_ID" --format='value(status)')
            echo "$(date -u +%H:%M:%S) Cloud Build ${status}"
            case "$status" in
              SUCCESS)
                break
                ;;
              FAILURE|TIMEOUT|CANCELLED|EXPIRED|INTERNAL_ERROR)
                echo "Cloud Build failed: ${status}" >&2
                exit 1
                ;;
            esac
            sleep 10
          done
          if [ "$status" != SUCCESS ]; then
            echo "Cloud Build did not finish in time: ${status:-unknown}" >&2
            exit 1
          fi
          echo "name=$image" >> "$GITHUB_OUTPUT"

      - name: Deploy image to Cloud Run
        shell: bash
        env:
          ARMED: ${{ vars.GATEWAY_REAL_PROVIDER_ARMED || '0' }}
          ROUTING_PRICING_CURRENCY: USD
          # Use the Pro price as a deliberately conservative ceiling even
          # though matrices currently run TRAFFIC_UNAWARE (Essentials).
          GOOGLE_PRICE_PER_1000_ELEMENTS: '10'
          DAILY_BUDGET_CENTS: ${{ vars.GATEWAY_DAILY_BUDGET_CENTS || '900' }}
          WEEKLY_BUDGET_CENTS: ${{ vars.GATEWAY_WEEKLY_BUDGET_CENTS || '3000' }}
          DAILY_USAGE_UNITS: ${{ vars.GATEWAY_DAILY_USAGE_UNITS || '900' }}
          WEEKLY_USAGE_UNITS: ${{ vars.GATEWAY_WEEKLY_USAGE_UNITS || '3000' }}
        run: |
          set -euo pipefail
          git_sha="${GITHUB_SHA:0:7}"
          new_rev="${CLOUD_RUN_SERVICE}-n${git_sha}"

          # An earlier failed revision can leave a generated revision name in
          # the service template. Clear that name before creating a fresh
          # revision, otherwise Cloud Run may reject this deploy immediately.
          gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format=json \
            | GIT_SHA="$git_sha" IMAGE="${{ steps.image.outputs.name }}" APP_VERSION="$GITHUB_SHA" \
              node ./scripts/prepare-cloud-run-revision.mjs \
            > /tmp/cloud-run-service.json
          token="$(gcloud auth print-access-token)"
          http_code="$(curl --silent --show-error --output /tmp/cloud-run-put.json --write-out '%{http_code}' \
            --request PUT \
            --header "Authorization: Bearer ${token}" \
            --header 'Content-Type: application/json' \
            "https://${GCP_REGION}-run.googleapis.com/apis/serving.knative.dev/v1/namespaces/${GCP_PROJECT_NUMBER}/services/${CLOUD_RUN_SERVICE}" \
            --data-binary @/tmp/cloud-run-service.json)"
          echo "Cloud Run service template reset: HTTP ${http_code}"
          if [ "$http_code" != 200 ] && [ "$http_code" != 201 ]; then
            cat /tmp/cloud-run-put.json
            exit 1
          fi
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --image="${{ steps.image.outputs.name }}" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --allow-unauthenticated \
            --max-instances=1 \
            --no-traffic \
            --revision-suffix="n${git_sha}" \
            --async \
            --set-secrets="${{ steps.secrets.outputs.secrets_arg }}" \
            --set-env-vars="GATEWAY_AUTH_MODE=none,GATEWAY_ENV=production,GATEWAY_REAL_PROVIDER_ARMED=${ARMED},ROUTING_PRICING_CURRENCY=${ROUTING_PRICING_CURRENCY},GOOGLE_PRICE_PER_1000_ELEMENTS=${GOOGLE_PRICE_PER_1000_ELEMENTS},GATEWAY_DAILY_BUDGET_CENTS=${DAILY_BUDGET_CENTS},GATEWAY_WEEKLY_BUDGET_CENTS=${WEEKLY_BUDGET_CENTS},GATEWAY_DAILY_USAGE_UNITS=${DAILY_USAGE_UNITS},GATEWAY_WEEKLY_USAGE_UNITS=${WEEKLY_USAGE_UNITS},APP_VERSION=${GITHUB_SHA}" \
            --quiet
          ready=""
          for _ in $(seq 1 90); do
            created=$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
              --project="$GCP_PROJECT_ID" \
              --region="$GCP_REGION" \
              --format='value(status.latestCreatedRevisionName)')
            ready=missing
            created_ready=missing
            if gcloud run revisions describe "$new_rev" \
              --project="$GCP_PROJECT_ID" \
              --region="$GCP_REGION" \
              --format=json > /tmp/want-rev.json 2>/tmp/want-rev.err; then
              ready=$(node ./scripts/cloud-run-ready-status.mjs < /tmp/want-rev.json)
            else
              echo "want describe failed: $(tr '\n' ' ' < /tmp/want-rev.err)"
            fi
            if gcloud run revisions describe "$created" \
              --project="$GCP_PROJECT_ID" \
              --region="$GCP_REGION" \
              --format=json > /tmp/created-rev.json 2>/tmp/created-rev.err; then
              created_ready=$(node ./scripts/cloud-run-ready-status.mjs < /tmp/created-rev.json)
            fi
            echo "$(date -u +%H:%M:%S) want ${new_rev} Ready=${ready}; created ${created} Ready=${created_ready}"
            if [ "$ready" = True ]; then
              break
            fi
            if [ "$created" = "$new_rev" ] && [ "$created_ready" = True ]; then
              ready=True
              break
            fi
            if [ "$ready" = False ] || { [ "$created" = "$new_rev" ] && [ "$created_ready" = False ]; }; then
              echo "New Cloud Run revision failed to start" >&2
              node -e "console.log(JSON.stringify(JSON.parse(require('fs').readFileSync('/tmp/want-rev.json','utf8')).status,null,2))" || true
              exit 1
            fi
            sleep 5
          done
          if [ "$ready" != True ]; then
            echo "Timed out waiting for ${new_rev}" >&2
            cat /tmp/want-rev.err || true
            node -e "console.log(JSON.stringify(JSON.parse(require('fs').readFileSync('/tmp/want-rev.json','utf8')).status,null,2))" || true
            exit 1
          fi

      - name: Verify deployment health
        shell: bash
        run: |
          set -euo pipefail
          revision="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.latestCreatedRevisionName)')"
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --to-revisions="${revision}=100" --quiet
          url="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)')"
          status="$(curl --fail --silent --show-error --max-time 30 "$url/health" | node -e "let s=''; process.stdin.on('data', d => s += d).on('end', () => process.stdout.write(JSON.parse(s).status))")"
          test "$status" = ok
          echo "Cloud Run health: $url/health"
