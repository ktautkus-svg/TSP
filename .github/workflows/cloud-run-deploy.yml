# Automatic Cloud Run deploy after every push to main.
#
# One-time setup (Windows PowerShell, from repo root):
#   npm run cloud-run:setup-github
# Uses Workload Identity Federation (no GCP_SA_KEY / JSON key file).
#
# Secret Manager values are reused from the first manual `npm run cloud-run:deploy`.

name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloud-run-deploy
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: logistika-504113
  GCP_PROJECT_NUMBER: '39855768031'
  GCP_REGION: europe-north1
  CLOUD_RUN_SERVICE: logistikos-pristatymai
  GCP_SERVICE_ACCOUNT: github-deploy@logistika-504113.iam.gserviceaccount.com
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/39855768031/locations/global/workloadIdentityPools/github-pool/providers/github-provider

jobs:
  quality:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm test

      - name: Validate SQLite schema
        run: npm run validate:schema

      - name: Build production PWA
        run: npm run pwa:build

      - name: Validate PWA bundle contract
        run: npm run pwa:test

  deploy:
    name: Deploy PWA
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build Cloud Run secrets argument
        id: secrets
        shell: bash
        run: |
          SECRET_NAMES=(
            GATEWAY_DEVICE_SECRET
            GOOGLE_ROUTES_API_KEY
            GOOGLE_API_KEY
            GOOGLE_GEOCODING_API_KEY
            GOOGLE_MAPS_API_KEY
            GOOGLE_VISION_API_KEY
            HERE_API_KEY
          )
          PAIRS=()
          for name in "${SECRET_NAMES[@]}"; do
            if gcloud secrets describe "$name" --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
              PAIRS+=("${name}=${name}:latest")
            fi
          done
          if ! gcloud secrets describe GATEWAY_DEVICE_SECRET --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
            echo "GATEWAY_DEVICE_SECRET missing. Run npm run cloud-run:deploy once locally first."
            exit 1
          fi
          GOOGLE_FOUND=false
          for name in GOOGLE_ROUTES_API_KEY GOOGLE_API_KEY GOOGLE_GEOCODING_API_KEY GOOGLE_MAPS_API_KEY GOOGLE_VISION_API_KEY; do
            if gcloud secrets describe "$name" --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
              GOOGLE_FOUND=true
              break
            fi
          done
          if [ "$GOOGLE_FOUND" = false ]; then
            echo "At least one GOOGLE_* secret is required in Secret Manager."
            exit 1
          fi
          SECRETS_ARG=$(IFS=,; echo "${PAIRS[*]}")
          echo "secrets_arg=$SECRETS_ARG" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run
        shell: bash
        # --set-env-vars pakeičia VISUS servise esančius kintamuosius, todėl
        # routing išlaidų apsaugos reikšmės turi būti perduotos kiekvieno deploy
        # metu. Konsolėje ranka pakeistas GATEWAY_REAL_PROVIDER_ARMED būtų tyliai
        # grąžintas atgal, todėl realaus režimo jungiklis yra repo variable.
        env:
          ARMED: ${{ vars.GATEWAY_REAL_PROVIDER_ARMED || '0' }}
          DAILY_BUDGET_CENTS: ${{ vars.GATEWAY_DAILY_BUDGET_CENTS || '500' }}
          WEEKLY_BUDGET_CENTS: ${{ vars.GATEWAY_WEEKLY_BUDGET_CENTS || '2000' }}
          DAILY_USAGE_UNITS: ${{ vars.GATEWAY_DAILY_USAGE_UNITS || '7290' }}
          WEEKLY_USAGE_UNITS: ${{ vars.GATEWAY_WEEKLY_USAGE_UNITS || '36450' }}
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          GIT_SHA=$(git rev-parse --short HEAD)
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/cloud-run-source-deploy/${CLOUD_RUN_SERVICE}:sha${GIT_SHA}"
          # Build a uniquely tagged image first. `gcloud run deploy --source`
          # kept reusing the failed revision logistikos-pristatymai-00177-2n2.
          # `gcloud builds submit` without --async also fails: this SA cannot
          # read the default Cloud Build logs bucket.
          BUILD_ID=$(gcloud builds submit \
            --project="$GCP_PROJECT_ID" \
            --tag "$IMAGE" \
            --timeout=1200s \
            --async \
            --format='value(id)')
          echo "Cloud Build ${BUILD_ID} -> ${IMAGE}"
          STATUS=""
          for _ in $(seq 1 120); do
            STATUS=$(gcloud builds describe "$BUILD_ID" --project="$GCP_PROJECT_ID" --format='value(status)')
            echo "$(date -u +%H:%M:%S) Cloud Build ${STATUS}"
            case "$STATUS" in
              SUCCESS) break ;;
              FAILURE|TIMEOUT|CANCELLED|EXPIRED|INTERNAL_ERROR)
                echo "Cloud Build failed: ${STATUS}"
                exit 1
                ;;
            esac
            sleep 10
          done
          if [ "$STATUS" != SUCCESS ]; then
            echo "Cloud Build did not finish in time: ${STATUS:-unknown}"
            exit 1
          fi
          # Failed source revision 00177-2n2 and later pinned suffixes block new
          # revisions. Delete anything created that is not serving, then deploy
          # the new image with an auto-generated revision name.
          READY_REV=$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format='value(status.latestReadyRevisionName)')
          CREATED_REV=$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format='value(status.latestCreatedRevisionName)')
          echo "Ready revision ${READY_REV}; latest created ${CREATED_REV}"
          if [ -n "$CREATED_REV" ] && [ "$CREATED_REV" != "$READY_REV" ]; then
            gcloud run revisions delete "$CREATED_REV" \
              --project="$GCP_PROJECT_ID" \
              --region="$GCP_REGION" \
              --quiet || true
          fi
          gcloud run revisions delete "${CLOUD_RUN_SERVICE}-00177-2n2" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --quiet || true
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --image "$IMAGE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --allow-unauthenticated \
            --max-instances=1 \
            --no-traffic \
            --clear-revision-suffix \
            --async \
            --set-secrets="${{ steps.secrets.outputs.secrets_arg }}" \
            --set-env-vars="GATEWAY_AUTH_MODE=none,GATEWAY_ENV=production,GATEWAY_REAL_PROVIDER_ARMED=${ARMED},GATEWAY_DAILY_BUDGET_CENTS=${DAILY_BUDGET_CENTS},GATEWAY_WEEKLY_BUDGET_CENTS=${WEEKLY_BUDGET_CENTS},GATEWAY_DAILY_USAGE_UNITS=${DAILY_USAGE_UNITS},GATEWAY_WEEKLY_USAGE_UNITS=${WEEKLY_USAGE_UNITS},APP_VERSION=${APP_VERSION},GIT_SHA=${GIT_SHA}" \
            --quiet
          NEW_REV=""
          READY=""
          for _ in $(seq 1 60); do
            NEW_REV=$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
              --project="$GCP_PROJECT_ID" \
              --region="$GCP_REGION" \
              --format='value(status.latestCreatedRevisionName)')
            READY=$(gcloud run revisions describe "$NEW_REV" \
              --project="$GCP_PROJECT_ID" \
              --region="$GCP_REGION" \
              --format='value(status.conditions[?type=Ready].status)' 2>/dev/null || true)
            echo "$(date -u +%H:%M:%S) revision ${NEW_REV} Ready=${READY:-missing}"
            if [ -n "$NEW_REV" ] && [ "$NEW_REV" != "$CREATED_REV" ] && [ "$NEW_REV" != "${CLOUD_RUN_SERVICE}-00177-2n2" ]; then
              case "$READY" in
                True) break ;;
                False)
                  echo "New Cloud Run revision failed to start"
                  gcloud run revisions describe "$NEW_REV" \
                    --project="$GCP_PROJECT_ID" \
                    --region="$GCP_REGION" \
                    --format='yaml(status.conditions)' || true
                  exit 1
                  ;;
              esac
            fi
            sleep 5
          done
          if [ "$READY" != True ]; then
            echo "Timed out waiting for a new Cloud Run revision"
            exit 1
          fi

      - name: Route production traffic to latest revision
        shell: bash
        run: |
          REVISION=$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format='value(status.latestCreatedRevisionName)')
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --to-revisions="${REVISION}=100" \
            --quiet

      - name: Verify /health
        shell: bash
        run: |
          URL=$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format='value(status.url)')
          BODY=$(curl -sf "$URL/health")
          echo "$BODY"
          echo "$BODY" | grep -q '"status":"ok"'
